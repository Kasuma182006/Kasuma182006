name: Actualizar tabla de repositorios

on:
  schedule:
    - cron: "0 6 * * 1"   # lunes 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar tabla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "| 📦 Repositorio | 📝 Descripción | 🕹️ Lenguaje | 📅 Creado |"
            echo "| --- | --- | --- | --- |"
            gh api "users/$OWNER/repos?type=owner&sort=created&per_page=100" \
              --jq '[.[] | select(.fork|not) | select(.name != "'"$OWNER"'")]
                    | .[:6][]
                    | "| [\(.name)](\(.html_url)) | \(.description // "-") | \(.language // ({"Proyecto_Arquitectura_Ncapas-MVC":"Java","Proyecto_Arquitectura_Hexagonal":"Java"}[.name]) // "-") | \(.created_at[:10]) |"'
          } > table.md

      - name: Insertar en README
        run: |
          awk '
            /<!-- REPOS:START -->/ { print; while ((getline line < "table.md") > 0) print line; skip=1; next }
            /<!-- REPOS:END -->/   { skip=0 }
            !skip { print }
          ' README.md > README.new && mv README.new README.md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: actualizar tabla de repositorios"
          git push
